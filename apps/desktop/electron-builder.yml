appId: io.github.wervex.km0
productName: KM0
executableName: KM0
copyright: Copyright © 2026 WERvEX
directories:
  output: release/${version}
  buildResources: build
# Everything the app needs is bundled into out/ by electron-vite; no node_modules ship.
files:
  - out/**/*
  - package.json
asar: true
# KM0's MCP server for Claude Desktop, outside the asar so KM0's own executable can run it as Node.
extraResources:
  - from: out/mcp/km0-mcp.cjs
    to: km0-mcp.cjs
npmRebuild: false
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: KM0-${version}-setup-${arch}.${ext}
  # Signed when CI provides CSC_LINK / CSC_KEY_PASSWORD (a code-signing certificate); unsigned otherwise.
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
    # The in-app updater on macOS installs from the zip.
    - target: zip
      arch: [x64, arm64]
  category: public.app-category.developer-tools
  artifactName: KM0-${version}-${arch}.${ext}
  # Signing uses CSC_LINK / CSC_KEY_PASSWORD when CI has them; notarization runs when APPLE_ID,
  # APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID are set. Without them the build is unsigned.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
linux:
  target:
    - target: AppImage
      arch: [x64]
  category: Development
  executableName: km0
  artifactName: KM0-${version}-${arch}.${ext}
# Where the in-app updater looks: the app carries app-update.yml, and each build writes latest*.yml, which
# the release job uploads next to the installers. Packaging itself never publishes (--publish never).
publish:
  provider: github
  owner: WERvEX
  repo: KM0
  releaseType: release
