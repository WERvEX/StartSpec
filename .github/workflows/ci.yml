name: CI

on:
  push:
  pull_request:
  # Run by hand with a version such as v0.1.0 to tag the chosen commit and publish a release.
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to publish, such as v0.1.0
        required: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Model registry matches its leaderboard snapshots
        run: pnpm --filter @km0/registry check
      - run: pnpm build
      - name: Install Chromium and Electron system libraries
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests
        run: xvfb-run -a pnpm e2e
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: test-results/
          if-no-files-found: ignore

  web:
    name: Deploy web debug build
    needs: check
    # The latest push to master or a working branch is what the Pages site shows.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/claude/'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm web:build
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: apps/desktop/out/web
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Deploy web debug build from ${{ github.sha }}"

  update-test:
    # The in-app update for real: package an old and a new version, install the old one, serve the new one from
    # a local feed and update through Settings → About. An unsigned macOS app cannot update itself, so no macOS.
    name: In-app update (${{ matrix.os }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Package an old and a new version
        run: pnpm e2e:update:build
      - name: Update the old version to the new one (Linux)
        if: runner.os == 'Linux'
        run: |
          pnpm exec playwright install-deps chromium
          xvfb-run -a pnpm e2e:update
      - name: Update the old version to the new one (Windows)
        if: runner.os == 'Windows'
        run: pnpm e2e:update
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-test-${{ runner.os }}
          path: test-results/
          if-no-files-found: ignore

  package:
    name: Package (${{ matrix.os }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Code signing when the repository has the secrets (Settings → Secrets → Actions); unsigned otherwise.
      # Windows: WIN_CSC_LINK (base64 .pfx) and WIN_CSC_KEY_PASSWORD. macOS: MAC_CSC_LINK (base64 .p12) and
      # MAC_CSC_KEY_PASSWORD, plus APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID for notarization.
      CSC_LINK: ${{ matrix.os == 'windows-latest' && secrets.WIN_CSC_LINK || matrix.os == 'macos-latest' && secrets.MAC_CSC_LINK || '' }}
      CSC_KEY_PASSWORD: ${{ matrix.os == 'windows-latest' && secrets.WIN_CSC_KEY_PASSWORD || matrix.os == 'macos-latest' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Package
        shell: bash
        run: |
          # electron-builder reads an empty CSC_LINK as a path, so a secret that is not set must not be passed at all.
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!name}" ] || unset "$name"
          done
          if [ -z "${CSC_LINK:-}" ]; then export CSC_IDENTITY_AUTO_DISCOVERY=false; fi
          pnpm package
      - uses: actions/upload-artifact@v4
        with:
          name: KM0-${{ runner.os }}
          # The installers, plus what the in-app updater reads: latest*.yml, block maps and the macOS zips.
          path: |
            apps/desktop/release/*/KM0-*.exe
            apps/desktop/release/*/KM0-*.dmg
            apps/desktop/release/*/KM0-*.zip
            apps/desktop/release/*/KM0-*.AppImage
            apps/desktop/release/*/*.blockmap
            apps/desktop/release/*/latest*.yml
          if-no-files-found: error

  release:
    name: Publish release
    needs: package
    # A pushed v* tag, or a manual run with a tag, publishes the installers built above as a GitHub Release.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: KM0-*
          path: dist
          merge-multiple: true
      - name: Release notes, saying which installers are unsigned
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          WIN_SIGNED: ${{ secrets.WIN_CSC_LINK != '' }}
          MAC_SIGNED: ${{ secrets.MAC_CSC_LINK != '' && secrets.APPLE_ID != '' }}
        run: |
          cp "docs/releases/$TAG.md" dist/notes.md
          if [ "$WIN_SIGNED" != "true" ] || [ "$MAC_SIGNED" != "true" ]; then
            {
              echo
              echo "> 本次发布的安装包签名情况：Windows $([ "$WIN_SIGNED" = true ] && echo 已签名 || echo 未签名)，macOS $([ "$MAC_SIGNED" = true ] && echo 已签名并公证 || echo 未签名)。未签名的安装包首次打开时系统会提示，见上面的“注意”。macOS 未签名时应用内更新不可用，请从本页下载新版本。"
            } >> dist/notes.md
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: KM0 ${{ inputs.tag || github.ref_name }}
          body_path: dist/notes.md
          # KM0-* already takes the block maps; listing them again uploads them twice at once, which fails.
          files: |
            dist/**/KM0-*
            dist/**/latest*.yml
          fail_on_unmatched_files: true
